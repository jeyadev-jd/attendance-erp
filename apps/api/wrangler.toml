name = "attendance-erp-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Free tier: no paid features enabled below.

[triggers]
crons = ["0 20 * * *"] # 20:00 UTC nightly (adjust to your org's local midnight)

# No R2: report exports are generated and streamed in the same request, so the
# only storage this Worker needs is the database.

# Secrets (set via `wrangler secret put`, never committed):
#   SUPABASE_URL                — Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY   — bypasses RLS; never expose to the browser
#   JWT_SECRET        — signing key for access tokens
#   SMTP_USER         — Gmail address used to send OTP mail
#   SMTP_PASS         — Gmail App Password (not the account password)

[vars]
JWT_EXPIRY_SECONDS = "3600"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
OTP_TTL_MINUTES = "10"
TEMP_STUDENT_PASSWORD = "Student@123"
